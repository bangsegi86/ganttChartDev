appId: com.smartgantt.app
productName: Smart Gantt
copyright: Copyright © 2026
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - dist-electron/**/*
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
    - target: zip
      arch:
        - x64
nsis:
  artifactName: ${productName}-Setup-${version}.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
portable:
  artifactName: ${productName}-Portable-${version}.${ext}
mac:
  target:
    - dmg
  category: public.app-category.productivity
linux:
  icon: build/icon.png
  target:
    - AppImage
  category: Office
